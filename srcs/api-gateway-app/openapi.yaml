openapi: 3.0.3
info:
  title: Play with Containers - Microservices API Gateway
  description: |
    API documentation for the Play with Containers project microservices infrastructure.
    All client interactions route through the API Gateway on port 3000.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local API Gateway
paths:
  /health:
    get:
      summary: Gateway Healthcheck
      description: Returns health status of the API Gateway service.
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /api/movies:
    get:
      summary: List all movies
      description: |
        Returns all movie items with optional case-insensitive substring search by title.
        The trailing-slash form `/api/movies/` is equivalent and is the spelling used
        by the audit checklist.
      parameters:
        - name: title
          in: query
          description: Filter movies by title substring
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
        '503':
          description: |
            The inventory service could not serve the request. Returned when the
            upstream call fails outright (connection refused, DNS failure,
            timeout) or when the inventory service itself answers 5xx - typically
            because its database is unreachable. The dependency being unavailable
            is not a gateway bug, so this is 503 (retryable) rather than 5xx.
            The response body carries a generic message; the upstream detail is
            written to the api-gateway-app log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new movie
      description: Adds a new movie record to the inventory database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 255
                  description: |
                    At most 255 characters, matching the `VARCHAR(255)` column in
                    srcs/inventory-database/init.sql. A longer title is rejected
                    with a 400 rather than being truncated by the database.
                  example: A new movie
                description:
                  type: string
                  description: |
                    Stored in an unbounded `TEXT` column, so there is no length
                    limit to enforce. The 1 MiB request-body limit still applies.
                  example: Very short description
      responses:
        '200':
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: |
            The payload is not storable. The body names the offending field and
            the reason, for each of these cases:
              * `Request body must be a JSON object` - the body is not a JSON object
              * `Field 'title' is required and cannot be empty` - no title on create
              * `Field 'title' cannot be empty` - title present but blank
              * `Field 'title' must be at most 255 characters (received N)` - over-long title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Field 'title' must be at most 255 characters (received 256)
        '413':
          description: The request body exceeds the 1 MiB limit (nginx client_max_body_size).
        '503':
          description: |
            The inventory service could not be reached, or it answered 5xx
            (typically a database outage). The gateway retries the upstream call
            a bounded number of times before returning this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete all movies (requires ?confirm=all)
      description: >-
        Clears all movies from the inventory database. Destructive and
        unauthenticated, so it is refused unless the caller passes ?confirm=all.
        Delete a single movie with DELETE /api/movies/{id}.
      parameters:
        - name: confirm
          in: query
          required: false
          schema:
            type: string
            enum: ['all']
          description: Must be exactly `all` for the catalogue to be cleared.
      responses:
        '200':
          description: All movies deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All 5 movies deleted
        '400':
          description: Missing ?confirm=all

  /api/movies/{id}:
    get:
      summary: Get movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Movie found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '404':
          description: Movie not found
    put:
      summary: Update movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: |
            The payload is not storable. The body names the offending field and
            the reason (blank title, or a title longer than 255 characters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Field 'title' must be at most 255 characters (received 300)
        '404':
          description: Movie not found
        '503':
          description: The inventory service could not be reached, or it answered 5xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Movie deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Movie with ID 1 successfully deleted
        '404':
          description: Movie not found

  /api/billing:
    post:
      summary: Submit billing order
      description: |
        Enqueues a new order message into RabbitMQ for asynchronous billing
        processing. The trailing-slash form `/api/billing/` is equivalent and is
        the spelling used by the audit checklist. The gateway does not wait for
        the consumer, so this returns 200 even when `billing-app` is stopped; the
        order is buffered in the durable queue and persisted once the worker
        returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - number_of_items
                - total_amount
              properties:
                user_id:
                  type: string
                  example: "20"
                number_of_items:
                  type: string
                  example: "99"
                total_amount:
                  type: string
                  example: "250"
      responses:
        '200':
          description: Order queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: '{"user_id": "20", "number_of_items": "99", "total_amount": "250"} sent'
        '400':
          description: Invalid request payload
        '503':
          description: |
            The order could not be queued because the message broker was
            unreachable, refused the connection or returned the message as
            unroutable. This is a dependency outage, not a gateway fault, so it is
            503 (retryable) rather than 500. The publish is attempted a bounded
            number of times first. The response body is a fixed generic message:
            the broker hostname and the driver's error text go to the
            api-gateway-app log, never to the client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The order could not be queued because the messaging service is unavailable. Please retry shortly.

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: |
            A stable, generic message. Internal hostnames, ports, driver error
            text and tracebacks are deliberately excluded and logged server-side.
          example: Upstream service is temporarily unavailable. Please retry shortly.
    Movie:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: A new movie
        description:
          type: string
          example: Very short description

