# =============================================================================
# cloud-design - local demonstration stack (6 services + 1 load balancer)
#
# This file is the LIVE counterpart of the AWS architecture in terraform/:
#
#   local docker compose          ->  AWS (terraform/)
#   ------------------------         ----------------------------------------
#   gateway-lb (nginx)          ->  ALB + api-gateway target group (alb.tf)
#   api-gateway-app  x2         ->  ECS service behind the ALB (ecs-tasks/)
#   inventory-app / billing-app ->  ECS services on Fargate
#   inventory-database          ->  RDS PostgreSQL 16.3 (rds.tf)
#   billing-database            ->  RDS PostgreSQL 16.3 (rds.tf)
#   rabbit-queue                ->  Amazon MQ for RabbitMQ (amazon_mq.tf)
#
# Every variable name below matches EXACTLY what the application code reads:
#   srcs/api-gateway-app/server.py, app/proxy.py, app/queue_sender.py
#   srcs/inventory-app/server.py, app/__init__.py
#   srcs/billing-app/server.py, app/__init__.py, app/consume_queue.py
#   srcs/{inventory,billing}-database/init-db.sh
#   srcs/rabbit-queue/entrypoint.sh
#
# Credentials are NEVER defaulted: ${VAR:?...} makes Compose fail immediately
# with a named error instead of handing an empty string to an application that
# would then either crash or silently authenticate with the wrong value.
# =============================================================================
name: cloud-design

# -----------------------------------------------------------------------------
# Reusable fragments
# -----------------------------------------------------------------------------

# Every long-running container gets a bounded grace period and a bounded log
# file. Without the first, `docker stop` falls back to SIGKILL (exit 137); with
# neither, json-file logs grow until the disk fills.
x-runtime-defaults: &runtime-defaults
  restart: on-failure:0        # Docker treats 0 as "unlimited retries" for on-failure
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-defaults: &app-defaults
  <<: *runtime-defaults
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true

networks:
  cloud-design-net:
    driver: bridge

volumes:
  # Named volumes, never bind mounts: the PostgreSQL data directory must be
  # owned by uid 70 (postgres) and RabbitMQ's by the rabbitmq user, which a
  # host bind mount would fight over.
  inventory-db-data:
  billing-db-data:
  gateway-logs:
  rabbit-queue-data:

# -----------------------------------------------------------------------------
# 1. inventory-database - PostgreSQL 17 (stands in for RDS)
# -----------------------------------------------------------------------------
services:

  inventory-database:
    build:
      context: ./srcs/inventory-database
      dockerfile: Dockerfile
    image: cloud-design/inventory-database:local
    container_name: cloud-design-inventory-database
    <<: *runtime-defaults
    # initdb + role/database/schema reconciliation happens before the server
    # starts listening, so the grace period must cover a cold start.
    stop_grace_period: 45s
    environment:
      DB_USER: ${INVENTORY_DB_USER:?set INVENTORY_DB_USER in .env - see .env.example}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env - see .env.example}
      DB_NAME: ${INVENTORY_DB_NAME:?set INVENTORY_DB_NAME in .env - see .env.example}
      PGDATA: /var/lib/postgresql/data
    ports:
      # Host 5432 is the audited port. billing-database is published on 5433
      # because two containers cannot bind the same host port.
      - "5432:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks: [cloud-design-net]
    healthcheck:
      # Probes the ROLE and DATABASE this instance actually serves, not just
      # "is a postgres listening": the cluster is briefly up with
      # listen_addresses='' while the schema is reconciled, and reporting
      # healthy then would let the app start against a half-built database.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$DB_USER\" -d \"$$DB_NAME\" -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ---------------------------------------------------------------------------
  # 2. billing-database - PostgreSQL 17 (stands in for RDS)
  # ---------------------------------------------------------------------------
  billing-database:
    build:
      context: ./srcs/billing-database
      dockerfile: Dockerfile
    image: cloud-design/billing-database:local
    container_name: cloud-design-billing-database
    <<: *runtime-defaults
    stop_grace_period: 45s
    environment:
      DB_USER: ${BILLING_DB_USER:?set BILLING_DB_USER in .env - see .env.example}
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env - see .env.example}
      DB_NAME: ${BILLING_DB_NAME:?set BILLING_DB_NAME in .env - see .env.example}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    networks: [cloud-design-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$DB_USER\" -d \"$$DB_NAME\" -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ---------------------------------------------------------------------------
  # 3. rabbit-queue - RabbitMQ 3.13 + management (stands in for Amazon MQ)
  # ---------------------------------------------------------------------------
  rabbit-queue:
    build:
      context: ./srcs/rabbit-queue
      dockerfile: Dockerfile
    image: cloud-design/rabbit-queue:local
    container_name: cloud-design-rabbit-queue
    <<: *runtime-defaults
    stop_grace_period: 40s
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env - see .env.example}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env - see .env.example}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-billing_queue}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      # Durable queue survives a broker restart, which is what makes the
      # "stop the consumer, keep taking orders" resilience test possible.
      - rabbit-queue-data:/var/lib/rabbitmq
    networks: [cloud-design-net]
    healthcheck:
      # The sentinel file is written by entrypoint.sh only AFTER
      # `rabbitmqctl authenticate_user` succeeds. Without it this check would
      # pass on a broker whose vhost permissions are not granted yet, and the
      # gateway would answer HTTP 500 to every POST /api/billing.
      test: ["CMD-SHELL", "test -f /tmp/rabbit-queue-ready && rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s

  # ---------------------------------------------------------------------------
  # 4. inventory-app - movie catalogue service
  # ---------------------------------------------------------------------------
  inventory-app:
    build:
      context: ./srcs/inventory-app
      dockerfile: Dockerfile
    image: cloud-design/inventory-app:local
    <<: *app-defaults
    environment:
      APP_PORT: "8080"
      INVENTORY_DB_HOST: inventory-database
      INVENTORY_DB_PORT: "5432"
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:?set INVENTORY_DB_USER in .env - see .env.example}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env - see .env.example}
      # Cold-start budget: 180 x 2s = 360s, comfortably above what a fresh
      # PostgreSQL cluster needed before it accepted connections. Too small a
      # budget turns a slow database into a restart loop.
      DB_CONNECT_MAX_RETRIES: ${DB_CONNECT_MAX_RETRIES:-180}
      DB_CONNECT_RETRY_DELAY: ${DB_CONNECT_RETRY_DELAY:-2}
    ports:
      - "8081:8080"     # direct access, bypasses the gateway
    networks: [cloud-design-net]
    depends_on:
      # Not blind ordering: the app must not start before PostgreSQL can
      # actually authenticate, or it burns its whole retry budget.
      inventory-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 5. billing-app - AMQP consumer + order writer
  # ---------------------------------------------------------------------------
  billing-app:
    build:
      context: ./srcs/billing-app
      dockerfile: Dockerfile
    image: cloud-design/billing-app:local
    <<: *app-defaults
    environment:
      APP_PORT: "8080"
      BILLING_DB_HOST: billing-database
      BILLING_DB_PORT: "5432"
      BILLING_DB_NAME: ${BILLING_DB_NAME:-billing_db}
      BILLING_DB_USER: ${BILLING_DB_USER:?set BILLING_DB_USER in .env - see .env.example}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env - see .env.example}
      DB_CONNECT_MAX_RETRIES: ${DB_CONNECT_MAX_RETRIES:-180}
      DB_CONNECT_RETRY_DELAY: ${DB_CONNECT_RETRY_DELAY:-2}
      RABBITMQ_HOST: rabbit-queue
      RABBITMQ_PORT: "5672"
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-billing_queue}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env - see .env.example}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env - see .env.example}
      # AMQPS knobs. These default to EMPTY, which the application code reads as
      # "unset", so local plaintext 5672 is unchanged. They exist so the TLS
      # path can be demonstrated without editing this file: set RABBITMQ_TLS=true
      # plus RABBITMQ_CA_FILE (a path visible INSIDE the container) and point
      # RABBITMQ_HOST/RABBITMQ_PORT at a TLS-enabled broker. AWS needs none of
      # this - on ECS RABBITMQ_PORT=5671 alone switches TLS on.
      RABBITMQ_TLS: ${RABBITMQ_TLS:-}
      RABBITMQ_CA_FILE: ${RABBITMQ_CA_FILE:-}
      RABBITMQ_TLS_VERIFY: ${RABBITMQ_TLS_VERIFY:-}
      # Throttle before nack+requeue, so a database outage becomes a slow retry
      # loop instead of a hot spin against the queue.
      REDELIVERY_BACKOFF_SECONDS: ${REDELIVERY_BACKOFF_SECONDS:-5}
    ports:
      - "8082:8080"
    networks: [cloud-design-net]
    depends_on:
      billing-database:
        condition: service_healthy
      rabbit-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 6. api-gateway-app - reverse proxy + RabbitMQ publisher (2 replicas)
  # ---------------------------------------------------------------------------
  api-gateway-app:
    build:
      context: ./srcs/api-gateway-app
      dockerfile: Dockerfile
    image: cloud-design/api-gateway-app:local
    <<: *app-defaults
    # Two replicas behind the load balancer: this is what makes "the load
    # balancing distributes traffic across the services" demonstrable rather
    # than theoretical. NOTE: no `container_name` here - Docker Compose cannot
    # scale a service that pins a name.
    deploy:
      replicas: 2
    environment:
      APP_PORT: "3000"
      INVENTORY_APP_HOST: inventory-app
      INVENTORY_APP_PORT: "8080"
      RABBITMQ_HOST: rabbit-queue
      RABBITMQ_PORT: "5672"
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-billing_queue}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env - see .env.example}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env - see .env.example}
      # Bounded publish budget: a dead broker must fail the HTTP request fast
      # instead of hanging it (2 attempts x 3s socket timeout).
      RABBITMQ_SOCKET_TIMEOUT: ${RABBITMQ_SOCKET_TIMEOUT:-3}
      RABBITMQ_PUBLISH_MAX_RETRIES: ${RABBITMQ_PUBLISH_MAX_RETRIES:-2}
      RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-1}
      # Same AMQPS knobs as billing-app; see the comment there for the rule.
      RABBITMQ_TLS: ${RABBITMQ_TLS:-}
      RABBITMQ_CA_FILE: ${RABBITMQ_CA_FILE:-}
      RABBITMQ_TLS_VERIFY: ${RABBITMQ_TLS_VERIFY:-}
    networks: [cloud-design-net]
    depends_on:
      inventory-app:
        condition: service_healthy
      rabbit-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=4)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 7. gateway-lb - the load balancer in front of the two gateway replicas.
  #
  # Local stand-in for the ALB in terraform/alb.tf, and the only way to answer
  # the audit question "is the load balancing configured correctly, effectively
  # distributing traffic across the services?" with `docker ps` plus a couple of
  # curl calls.
  #
  # nginx was chosen over Traefik because:
  #   * the same algorithm exists in ALB (least_conn) and ELB (round-robin), so
  #     the behaviour demonstrated locally is the behaviour deployed on AWS;
  #   * `$upstream_addr` in the access log makes the distribution PROVABLE
  #     (`docker compose logs gateway-lb | grep upstream=`) instead of inferred;
  #   * Traefik needs a labels/DI and a dashboard to be legible in a 60s demo.
  # ---------------------------------------------------------------------------
  gateway-lb:
    image: nginx:1.27-alpine
    container_name: cloud-design-gateway-lb
    <<: *runtime-defaults
    stop_grace_period: 10s
    depends_on:
      api-gateway-app:
        condition: service_healthy
    ports:
      # The single audited entry point: http://localhost:3000
      - "3000:8080"
    networks: [cloud-design-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    command:
      - /bin/sh
      - -c
      - |
        # This replaces the MAIN nginx.conf, not a conf.d drop-in: files in
        # conf.d are `include`d from inside http{}, where worker_processes,
        # events and http are not legal directives.
        rm -f /etc/nginx/conf.d/default.conf
        cat >/etc/nginx/nginx.conf <<'NGINX'
        worker_processes  auto;
        events { worker_connections 1024; }

        http {
            include       /etc/nginx/mime.types;
            default_type  application/json;
            sendfile      on;
            # Every upstream attempt is logged with the replica that served it,
            # which is what makes the distribution auditable.
            # NOTE: nginx variables are written $$var because Compose would
            # otherwise interpolate them out of the string before nginx sees it.
            log_format lb '$$remote_addr "$$request" $$status '
                          'upstream=$$upstream_addr upstream_time=$$upstream_response_time';
            access_log /var/log/nginx/access.log lb;

            # Docker's embedded DNS at 127.0.0.11, with a 10s TTL.
            resolver 127.0.0.11 ipv6=off valid=10s;

            upstream api_gateway {
                # `resolve` below re-resolves at runtime, which nginx only
                # allows for an upstream backed by a shared memory zone.
                zone api_gateway 64k;
                # Same algorithm family as the ALB target group in alb.tf.
                least_conn;
                # `resolve` re-resolves the service name instead of pinning the
                # replica IPs found at startup, so a replaced or scaled
                # container is picked up without restarting nginx.
                server api-gateway-app:3000 resolve max_fails=3 fail_timeout=10s;
                keepalive 32;
            }

            server {
                listen 8080;
                server_name _;

                client_max_body_size 1m;   # matches the gateway's MAX_CONTENT_LENGTH

                location = /healthz {
                    proxy_pass http://api_gateway/health;
                    access_log off;
                }

                location / {
                    proxy_pass         http://api_gateway;
                    proxy_http_version 1.1;
                    proxy_set_header   Connection "";
                    proxy_set_header   Host              $$host;
                    proxy_set_header   X-Real-IP         $$remote_addr;
                    proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $$scheme;
                    proxy_connect_timeout 5s;
                    proxy_read_timeout    60s;
                    proxy_next_upstream error timeout http_502 http_503 http_504;
                    proxy_next_upstream_tries 2;
                }
            }
        }
        NGINX
        nginx -t
        exec nginx -g 'daemon off;'
