# =============================================================================
# kustomization.yaml  --  the single entry point for applying manifests/
# =============================================================================
# USE THIS, NOT `kubectl apply -f manifests/`
#
#   kubectl apply -k manifests/
#
# Two reasons (both structural, so they hold for any kubectl version):
#
#   1. ORDER. `kubectl apply -f <dir>` walks the directory in ALPHABETICAL
#      order. Alphabetically that is:
#        api-gateway.yaml, billing-app.yaml, billing-database.yaml, configmap.yaml,
#        inventory-app.yaml, ...
#      so the FIRST file applied is api-gateway.yaml, and its pods are created
#      before namespace.yaml has ever run -> the namespace does not exist and the
#      apply fails.
#      `resources:` below is an explicit, dependency-ordered list; kustomize emits
#      objects in list order and kubectl applies them one API call at a time, so
#      the Namespace is created first.
#
#   2. THIS FILE ITSELF. `kubectl apply -f <dir>` also parses
#      kustomization.yaml as if it were a workload manifest. It is not one: it is
#      an input to `kustomize build`. The API server has no Kustomization kind in
#      any group kubectl would try, so that file cannot be applied by `-f` no
#      matter what it contains.
#      (An earlier draft of this comment claimed the failure was
#      "[apiVersion not set, kind not set]" and suggested adding those two fields
#      would fix it. They are already set below, so that error text was stale and
#      the suggested "fix" would have broken `kubectl apply -k` instead — kustomize
#      would try to accumulate this file as one of its own resources. The exact
#      message kubectl prints also varies with version and cluster reachability,
#      so the mechanism above is stated instead of a transcript that cannot be
#      guaranteed to match. `-k` is the only supported form.)
#
# `kubectl apply -f <individual file>` also still works and is what
# scripts/deploy.sh does, in the same order.
#
# MINIMUM TOOLING: `sortOptions` below needs kustomize v5, i.e. kubectl >= 1.28
# (kubectl 1.37 embeds kustomize v5.8.1). On an older kubectl this file is
# rejected with `unknown field "sortOptions"` and you must apply the files
# individually in the order listed below.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Without this, kustomize REORDERS `resources` by a built-in kind precedence
# (Namespace, ConfigMap, Secret, Service, Deployment, ... NetworkPolicy) and
# ignores the order below -- which would silently apply the NetworkPolicies
# AFTER the workloads, giving the pods a window at startup in which egress is
# unfiltered. `fifo` makes the declared order the emitted order. Verified:
# with the default ordering this directory emitted the 8 NetworkPolicies last,
# after all 6 workload objects; with `fifo` they come out in position 4.
sortOptions:
  order: fifo
# -----------------------------------------------------------------------------
# LOCAL / DEMO CLUSTER
# -----------------------------------------------------------------------------
# These image names have no registry behind them (see the IMAGE / PRELOADING
# block at the top of api-gateway.yaml). They resolve only because the image is
# already present on the node after `k3d image import` / `kind load`, and
# `imagePullPolicy: IfNotPresent` tells the kubelet not to try to pull them.
# This is the configuration an auditor can actually run, so it is the default.
resources:
  # --- 1. the namespace MUST come first; see the ORDER note above ---------
  - namespace.yaml
  # --- 2. configuration the workloads reference --------------------------
  - secrets.yaml
  - configmap.yaml
  # --- 3. admission-time network restrictions ---------------------------
  #     Applied before the pods exist so that a pod cannot reach the internet
  #     even during its own startup window.
  - network-policies.yaml
  # --- 4. stateful data tier, before anything that connects to it --------
  - rabbitmq.yaml
  - inventory-database.yaml
  - billing-database.yaml
  # --- 5. application tier ----------------------------------------------
  - inventory-app.yaml
  - billing-app.yaml
  - api-gateway.yaml
  # --- 6. AWS edge. OMIT THIS ONE for a local k3d/kind cluster: it needs the
  #        AWS Load Balancer Controller and a validated ACM certificate, and
  #        neither can exist locally. Applying it locally is harmless (the
  #        object is stored and simply never acted upon), but it will leave a
  #        permanently ADDRESS-less Ingress in `kubectl get ingress`, which is
  #        confusing during a demo.
#      - ingress.yaml
# -----------------------------------------------------------------------------
# PRODUCTION / AWS  --  uncomment and rewrite the image references
# -----------------------------------------------------------------------------
# The single documented value the operator overrides is the image location.
# Two ways to do it:
#
#   (a) edit this block, then `kubectl apply -k manifests/`:
#       images:
#         - name: cloud-design/api-gateway
#           newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/cloud-design/api-gateway
#           newTag: v1.0.0
#         ... one entry per workload, all six of them ...
#
#   (b) keep this file untouched and let kustomize edit itself -- the
#       conventional, diff-friendly route:
#       cd manifests
#       for s in api-gateway inventory-app billing-app \
#                inventory-database billing-database rabbitmq; do
#         kustomize edit set image \
#           "cloud-design/$s=123456789012.dkr.ecr.us-east-1.amazonaws.com/cloud-design/$s:v1.0.0"
#       done
#       # inspect the result before applying:
#       kubectl kustomize manifests/ | less
#
# Either way, PIN THE TAG. `:latest` is only correct for the preloaded-local-
# image flow above; a registry deployment on a mutable tag means a rollout can
# pick up an unbuilt, unvetted image with no way to tell which digest a running
# pod is running. `kubectl rollout undo` cannot undo that.
#
# Pinning the digest is stronger still:
#       kubectl set image deployment/api-gateway api-gateway=<repo>@sha256:<digest>
# -----------------------------------------------------------------------------
# NOTES ON WHAT IS DELIBERATELY *NOT* IN THIS FILE
# -----------------------------------------------------------------------------
# * No `namespace:` transformer: every object in `resources` already sets
#   `metadata.namespace: cloud-design` explicitly. A namespace transformer would
#   additionally stamp `metadata.namespace` onto the Namespace object itself,
#   which is meaningless at best, and it hides the real per-file ordering
#   dependency instead of documenting it.
# * No `commonLabels`/`labels` transformer: it can inject into
#   `spec.selector.matchLabels` of the Deployments/StatefulSets, and a
#   selector is IMMUTABLE after creation. Adding such a label to a cluster
#   that already has these workloads deployed would make the next apply fail
#   with `field is immutable`. Every manifest already carries
#   `app.kubernetes.io/part-of: cloud-design` on its own metadata.
# * No `images:` block active by default -- see the rationale above; the local
#   names are already correct for the k3d/kind flow, so an identity mapping
#   would be noise.
# * No `secretsGenerator`: the Secret is committed as a documented template on
#   purpose (see secrets.yaml). In production it should come from AWS Secrets
#   Manager via the External Secrets Operator, which needs its own
#   ClusterSecretStore -- also not created by this repository.
