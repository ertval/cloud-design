# =============================================================================
# secrets.yaml
# =============================================================================
# !! REPLACE EVERY VALUE BELOW BEFORE `kubectl apply`.               !!
# !! NEVER COMMIT secrets.yaml WITH REAL VALUES.                      !!
# !! `git add manifests/secrets.yaml` WITH REAL CREDENTIALS IS A     !!
# !! CREDENTIAL LEAK EVEN IF YOU LATER REVERT THE COMMIT.             !!
#
# WHAT THIS FILE IS
#   A committed *template*. The REPLACE_ME_* values below are intentionally
#   invalid so that an operator who forgets this step gets a loud, obvious
#   failure (PostgreSQL `password authentication failed`, RabbitMQ refusing
#   `NOT_ALLOWED - access to vhost '/' refused`) instead of a cluster running
#   on a guessable default credential. That is the correct trade-off.
#
# HOW TO FILL IT IN (pick ONE; do not mix)
#   1. Local/demo cluster only -- apply the values from OUTSIDE the repo, so
#      nothing in git ever changes:
#         kubectl create secret generic cloud-design-secrets \
#           --namespace cloud-design \
#           --from-literal=INVENTORY_DB_USER=...  \
#           --from-literal=INVENTORY_DB_PASSWORD=... \
#           --from-literal=BILLING_DB_USER=...    \
#           --from-literal=BILLING_DB_PASSWORD=... \
#           --from-literal=RABBITMQ_USER=...       \
#           --from-literal=RABBITMQ_PASSWORD=...   \
#           --dry-run=client -o yaml | kubectl apply -f -
#
#      !! ORDER MATTERS, AND THIS BITES EVERY TIME !!
#      `kubectl apply -k manifests/` and `kubectl apply -f manifests/secrets.yaml`
#      BOTH include this file, so running either one AFTER the command above
#      SILENTLY REVERTS the live Secret back to the REPLACE_ME_* placeholders.
#      kubectl reports only `secret/cloud-design-secrets configured` -- no
#      warning -- and every application then fails with
#        FATAL: password authentication failed for user "REPLACE_ME_BILLING_USER"
#      while the databases keep reporting themselves perfectly healthy, so the
#      symptom looks like an application bug rather than a reverted Secret.
#      Verified on a live k3d cluster.
#      Correct sequence:
#         kubectl apply -k manifests/            # 1. everything, incl. template
#         <the --from-literal command above>     # 2. overwrite with real values
#         kubectl -n cloud-design rollout restart deploy/inventory-app \
#                                                 deploy/api-gateway
#         kubectl -n cloud-design rollout restart sts/billing-app
#      Step 3 is required because `envFrom`/`secretKeyRef` values are resolved
#      when a container starts, not when the Secret changes: a running pod keeps
#      the credentials it booted with. To avoid the whole problem, apply the
#      workloads and the Secret in separate steps and never re-apply this file
#      to a live cluster.
#   2. Production -- do not use this file at all. The Terraform team already
#      stores the real credentials in AWS Secrets Manager
#      (terraform/rds.tf, terraform/amazon_mq.tf); pull them in with the
#      External Secrets Operator, or with SealedSecrets. Both write the Secret
#      at runtime and leave this template untouched in git.
#
# ON AWS: Secrets Manager + ESO is the correct answer, because a Kubernetes
# Secret is only base64-encoded in etcd and would otherwise be readable by
# anything with RBAC on this namespace.
#
# -----------------------------------------------------------------------------
# KEY-BY-KEY CROSS-CHECK AGAINST THE APPLICATION SOURCE
# -----------------------------------------------------------------------------
# Every key below is read through a `_require_env()` helper that raises
# RuntimeError on an empty/missing value -- there is NO hardcoded fallback, so
# a missing key is a hard CrashLoopBackOff, not a silent default:
#
#   INVENTORY_DB_USER      srcs/inventory-app/app/__init__.py:32
#   INVENTORY_DB_PASSWORD  srcs/inventory-app/app/__init__.py:33
#   BILLING_DB_USER        srcs/billing-app/app/__init__.py:31
#   BILLING_DB_PASSWORD    srcs/billing-app/app/__init__.py:32
#   RABBITMQ_USER          srcs/api-gateway-app/app/queue_sender.py:50
#                          srcs/billing-app/app/consume_queue.py:66
#                          srcs/rabbit-queue/entrypoint.sh:5   (:? guard)
#   RABBITMQ_PASSWORD      srcs/api-gateway-app/app/queue_sender.py:51
#                          srcs/billing-app/app/consume_queue.py:67
#                          srcs/rabbit-queue/entrypoint.sh:6   (:? guard)
#
# The three data StatefulSets also consume these same keys, re-projected under
# their own names by explicit `env:`/`secretKeyRef` entries (NOT via envFrom):
#   inventory-database.yaml -> DB_USER=INVENTORY_DB_USER, DB_PASSWORD=INVENTORY_DB_PASSWORD
#   billing-database.yaml   -> DB_USER=BILLING_DB_USER,   DB_PASSWORD=BILLING_DB_PASSWORD
#   rabbitmq.yaml           -> RABBITMQ_USER, RABBITMQ_PASSWORD
# These names are mandated by the images themselves:
#   srcs/*/init-db.sh   requires DB_USER, DB_PASSWORD, DB_NAME (`:?`)
#   srcs/rabbit-queue/entrypoint.sh requires RABBITMQ_USER, RABBITMQ_PASSWORD (`:?`)
#
# Constraint that is easy to miss: `RABBITMQ_USER` must NOT be `guest`.
# srcs/rabbit-queue/entrypoint.sh:8-11 rejects it explicitly and exits 1,
# because the entrypoint deletes the built-in `guest` account after creating
# the configured one -- a `guest` value would leave the broker with zero
# usable accounts.
#
# KNOWN LIMITATION (deliberately NOT changed here, documented instead)
#   The three apps load this Secret through `envFrom.secretRef`, which imports
#   all six keys into all three containers. inventory-app therefore holds the
#   RabbitMQ and billing credentials and vice versa. Closing that gap needs one
#   Secret per workload (`cloud-design-inventory-db`, `cloud-design-billing-db`,
#   `cloud-design-rabbitmq`) with per-key `secretKeyRef` entries instead of
#   `envFrom`. That is a deliberate structural change to how the whole repo
#   consumes credentials (Terraform, docker-compose and ecs-tasks all assume
#   the single-Secret shape), so it is recorded here as a follow-up rather than
#   landed unilaterally inside the manifests commit.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloud-design-secrets
  namespace: cloud-design
  labels:
    app.kubernetes.io/part-of: cloud-design
type: Opaque
stringData:
  INVENTORY_DB_USER: "REPLACE_ME_INVENTORY_USER"
  INVENTORY_DB_PASSWORD: "REPLACE_ME_INVENTORY_PASSWORD"
  BILLING_DB_USER: "REPLACE_ME_BILLING_USER"
  BILLING_DB_PASSWORD: "REPLACE_ME_BILLING_PASSWORD"
  RABBITMQ_USER: "REPLACE_ME_RABBITMQ_USER"
  RABBITMQ_PASSWORD: "REPLACE_ME_RABBITMQ_PASSWORD"
