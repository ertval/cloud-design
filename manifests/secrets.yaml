# never commit real values. Replace REPLACE_ME_* before local testing only.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-design-secrets
  namespace: cloud-design
  labels:
    app.kubernetes.io/part-of: cloud-design
type: Opaque
stringData:
  INVENTORY_DB_USER: "REPLACE_ME_INVENTORY_USER"
  INVENTORY_DB_PASSWORD: "REPLACE_ME_INVENTORY_PASSWORD"
  BILLING_DB_USER: "REPLACE_ME_BILLING_USER"
  BILLING_DB_PASSWORD: "REPLACE_ME_BILLING_PASSWORD"
  RABBITMQ_USER: "REPLACE_ME_RABBITMQ_USER"
  RABBITMQ_PASSWORD: "REPLACE_ME_RABBITMQ_PASSWORD"
