[pytest]
# Without this file the suite does not run at all. `srcs/billing-app/tests/
# test_validation.py` and `srcs/inventory-app/tests/test_validation.py` share a
# basename and neither directory is a package, so pytest's default prepend
# import mode refuses the second one with "import file mismatch" and aborts the
# whole run at collection. That is why two documents in this repo disagreed
# about the test count (18 versus 24) -- nobody could execute the suite to find
# out. importlib mode keys each module by its full path, so both coexist.
addopts = --import-mode=importlib
testpaths = srcs
python_files = test_*.py